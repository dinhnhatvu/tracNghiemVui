<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đề thi trắc nghiệm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Nhúng file style.css bạn vừa tách -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Thêm class để giới hạn số dòng của tiêu đề, giúp các card bằng nhau */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body class="text-gray-800">

    <!-- NAVBAR (Giữ nguyên như trang làm bài) -->
    <nav class="bg-slate-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-6">
                    <span class="font-bold text-xl tracking-tight text-white">BaiTap<span
                            class="text-green-400">Vui</span></span>
                    <div class="hidden md:flex space-x-4 text-sm font-medium">
                        <a href="index.html" class="hover:text-green-400 transition">Trang chủ</a>
                        <a href="add_question.html" class="text-green-400 transition">Thêm câu hỏi</a>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative hidden sm:block">
                        <input type="text" placeholder="Tìm kiếm..."
                            class="py-1 px-3 pr-8 rounded bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-green-500 w-64 text-sm">
                        <svg class="w-4 h-4 text-gray-500 absolute right-2 top-1.5" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <button
                        class="bg-green-500 hover:bg-green-600 text-white px-4 py-1.5 rounded text-sm font-medium transition">Đăng
                        nhập</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="mb-8 flex justify-between items-end border-b border-gray-200 pb-4">
            <h1 class="text-2xl font-bold text-gray-900">Đề thi mới nhất</h1>
            <a href="#" class="text-green-600 hover:text-green-700 font-medium text-sm">Xem tất cả →</a>
        </div>

        <!-- GRID DANH SÁCH ĐỀ THI -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

            <!-- Card 1 -->
            <div
                class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col h-full hover:shadow-md transition-shadow">
                <h3 class="text-[17px] font-bold text-gray-900 mb-2 leading-snug line-clamp-3">
                    Trắc nghiệm ôn tập môn Giáo dục học - Chương #1
                </h3>
                <p class="text-sm text-gray-500 mb-4 flex-grow">Giáo dục học</p>

                <div class="flex justify-between items-center text-sm text-gray-500 mb-5 font-medium">
                    <span class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z"
                                clip-rule="evenodd"></path>
                        </svg>
                        40 câu hỏi
                    </span>
                    <span>35 phút</span>
                </div>

                <div class="flex items-center gap-3 mt-auto">
                    <!-- Sửa href thành tên file HTML bài làm của bạn -->
                    <a href="chuong-1.html"
                        class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg text-center transition-colors">
                        Làm đề
                    </a>
                    <button class="text-gray-400 hover:text-gray-600 transition p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                        </svg>
                    </button>
                    <button class="text-gray-400 hover:text-red-500 transition p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Card 2 -->
            <div
                class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col h-full hover:shadow-md transition-shadow">
                <h3 class="text-[17px] font-bold text-gray-900 mb-2 leading-snug line-clamp-3">
                    Chưa có
                </h3>
                <p class="text-sm text-gray-500 mb-4 flex-grow">Triết học Mác - Lênin</p>

                <div class="flex justify-between items-center text-sm text-gray-500 mb-5 font-medium">
                    <span class="flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z"
                                clip-rule="evenodd"></path>
                        </svg>
                        30 câu hỏi
                    </span>
                    <span>30 phút</span>
                </div>

                <div class="flex items-center gap-3 mt-auto">
                    <a href="#"
                        class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg text-center transition-colors">Làm
                        đề</a>
                    <button class="text-gray-400 hover:text-gray-600 transition p-1"><svg class="w-6 h-6" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                        </svg></button>
                    <button class="text-gray-400 hover:text-red-500 transition p-1"><svg class="w-6 h-6" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
                            </path>
                        </svg></button>
                </div>
            </div>

        </div>
    </main>
    <footer class="bg-[#1e293b] text-center pt-8 pb-6 mt-12 border-t border-slate-700">
        <div class="max-w-4xl mx-auto px-4 flex flex-col items-center">

            <!-- Logo BaiTapTracNghiem -->
            <!-- Giảm margin bottom từ mb-8 xuống mb-4 -->
            <span class="font-bold text-[28px] tracking-tight text-white block mb-4">
                BaiTap<span class="text-[#22c55e]">Vui</span>
            </span>

            <!-- Dòng chữ Bản quyền -->
            <!-- Giảm margin bottom từ mb-6 xuống mb-4 -->
            <p class="text-[17px] text-gray-300 font-normal mb-4">
                &copy; 2026.
            </p>

            <!-- Đường kẻ mờ phân cách -->
            <!-- Thêm thẻ w-[80%] (hoặc max-w-lg) để đường kẻ không kéo dài quá mức ra 2 bên nếu bạn muốn -->
            <div class="w-full max-w-xl h-px bg-slate-600/60 mb-4"></div>

            <!-- Dòng chú thích bên dưới -->
            <p class="text-[15px] text-gray-400 font-normal">
                Không để ai bị bỏ lại phía sau
            </p>

        </div>
    </footer>

</body>

</html>
